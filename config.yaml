# 콘텐츠 파이프라인 설정
# 비밀값(API 키)은 여기 두지 말 것. .env 사용.

# 생성 언어: ko | en
language: ko

# 초기 니치 — 주제 필터링/글쓰기 프롬프트에 주입된다.
niche: "알고리즘 트레이딩, 퀀트 투자, 파이썬 자동매매"

collect:
  # 한 번 수집할 때 최종 선정할 주제 수
  top_n: 5
  sources:
    google_trends:
      enabled: true
      # 국가별 실시간 인기 검색어 RSS (trends.google.com/trending/rss?geo=..).
      # 시드 키워드 없이 그 나라 전체의 관심사를 그대로 가져온다.
      geos:
        - KR
        - US
    reddit:
      enabled: false  # praw 자격증명 설정 후 true
      subreddits:
        - algotrading
        - quant
      limit: 25

generate:
  # claude CLI 실행 파일. PATH에 없으면 절대경로로 지정.
  # 예: /Users/chury99/.claude/local/claude
  claude_bin: "claude"
  # claude -p 호출 타임아웃(초)
  timeout: 300
  # 초안 목표 분량
  target_words: 1500

publish:
  # 발행 어댑터: ghost | dryrun
  adapter: ghost
  ghost:
    # 예: https://your-site.ghost.io
    api_url: "https://CHANGE-ME.ghost.io"
    api_version: "v5.0"

notify:
  telegram:
    # 토큰/채팅ID 는 config/telegram.json (git 제외). 아래로 경로 변경 가능:
    # config_path: "config/telegram.json"
    enabled: true
    # 초안 생성이 끝나 검수가 필요할 때 알림
    on_drafts_ready: true
    # 발행 완료 통보 (승인이 아니라 사후 통보)
    on_published: true

paths:
  drafts: "drafts"
  prompts: "prompts"
  topics: "drafts/_topics.json"
